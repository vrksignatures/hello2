name: Build SudhaAutoBot Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run Tests & Build Debug APK
        run: |
          if [ -f "SudhaAutoBot/settings.gradle.kts" ]; then cd SudhaAutoBot; fi
          gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Upload SudhaAutoBot Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SudhaAutoBot-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
