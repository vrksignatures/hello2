name: Build SudhaAutoBot Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run Tests & Build Debug APK
        run: |
          if [ -z "$(find . -name 'settings.gradle.kts' -print -quit)" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' -print -quit)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
            fi
          fi
          SETTINGS_FILE=$(find . -name 'settings.gradle.kts' -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Repo mein settings.gradle.kts ya ZIP file nahi mili. Current files:"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building Gradle project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Upload SudhaAutoBot Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SudhaAutoBot-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
